# SPDX-License-Identifier: GPL-3.0-only
esphome:
  name: pac-airton
  friendly_name: PAC Airton
esp32:
  board: esp32dev
  framework:
    type: esp-idf
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 15dB
  ap:
    ssid: ESPAC
    password: !secret fallback_ap_password
captive_portal:
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
ota:
  - platform: esphome
    password: !secret ota_password
packages:
  core: !include ../packages/core.yaml
  external_sensor: !include ../packages/homeassistant-sensor.yaml
substitutions:
  ambient_sensor: external_temp
  external_temperature_entity: sensor.your_room_temperature
  wait_complete_control: "true"
web_server:
  port: 80
  version: 3
  log: true
